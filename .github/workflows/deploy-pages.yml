name: Build and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  initialize:
    runs-on: ubuntu-latest
    outputs:
      skip_build: ${{ steps.check_history.outputs.skip_build }}
    steps:
      - name: Check workflow history
        id: check_history
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy-pages.yml',
                event: 'push',
                per_page: 100
              }
            );

            const hasPreviousPush = runs.some(run => run.id !== context.runId);
            const skipInitialPush = context.eventName === 'push' && !hasPreviousPush;
            core.setOutput('skip_build', String(skipInitialPush));

  build:
    needs: initialize
    if: needs.initialize.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.initialize.outputs.skip_build != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.40,<2"
          python -m playwright install --with-deps chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Capture page snapshots
        run: xvfb-run --auto-servernum python page-snapshots.py
        env:
          PLAYWRIGHT_HEADLESS: "0"

      - name: Build manifest
        run: ./build-manifest.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
