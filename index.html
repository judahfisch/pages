<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e8">
  <title>Page Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Page Viewer home">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span>Page Viewer</span>
      </a>
      <div class="header-meta"><span class="status-dot"></span><span id="asset-count">Loading library</span></div>
    </header>

    <main id="app" class="main-content" aria-live="polite">
      <section class="loading-state"><span class="loader"></span><p>Mapping your pages</p></section>
    </main>

  </div>
</body>
</html>
